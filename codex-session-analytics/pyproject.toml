[project]
name = "codex-session-analytics"
version = "0.1.0"
description = "Per-session Codex token, cost, disk, and context-history analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
csa = "codex_session_analytics.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
